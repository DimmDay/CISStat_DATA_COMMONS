---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"

    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: UTC

    open-pull-requests-limit: 5

    reviewers:
      - DimmDay

    labels:
      - dependencies
      - github-actions

    commit-message:
      prefix: deps
