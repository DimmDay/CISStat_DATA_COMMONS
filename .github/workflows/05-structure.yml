---
name: Repository Structure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          directories=(
            "Governance"
            "ADR"
            "Standards"
            "Architecture"
            "Metamodel"
            "Ontology"
            "Data Models"
            "Knowledge Graph"
            "OpenAPI"
            "Portal"
          )
          missing=0
          for d in "${directories[@]}"; do
            if [ ! -d "$d" ]; then
              echo "Missing directory: $d"
              missing=1
            fi
          done
          exit $missing
